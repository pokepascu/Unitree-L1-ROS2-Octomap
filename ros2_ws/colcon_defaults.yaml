# All paths are absolute inside the mandatory project container. This keeps
# generated output at the workspace root even if colcon is invoked from src.
# The Unitree checkout also contains a ROS 1 package and a raw CMake SDK; only
# its ROS 2 driver is included in discovery.
"":
  log-base: /workspace/ros2_ws/log

list:
  base-paths: &ros2_base_paths
    - /workspace/ros2_ws/src/l1_bringup
    - /workspace/ros2_ws/src/l1_monitor
    - /workspace/ros2_ws/src/l1_octomap_bringup
    - /workspace/ros2_ws/src/octomap_mapping
    - /workspace/ros2_ws/src/unilidar_sdk/unitree_lidar_ros2

build:
  base-paths: *ros2_base_paths
  build-base: /workspace/ros2_ws/build
  install-base: /workspace/ros2_ws/install
  symlink-install: true
  event-handlers:
    - console_cohesion+

test:
  base-paths: *ros2_base_paths
  build-base: /workspace/ros2_ws/build
  install-base: /workspace/ros2_ws/install
  test-result-base: /workspace/ros2_ws/build
  event-handlers:
    - console_cohesion+

test-result:
  test-result-base: /workspace/ros2_ws/build

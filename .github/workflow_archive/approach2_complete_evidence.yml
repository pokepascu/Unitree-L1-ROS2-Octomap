name: Approach 2 complete three-scan ICP RViz evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/approach_2/**'
      - 'config/rviz/approach2_*.rviz'
      - 'config/rviz/approach1_pointcloud_*.rviz'
      - 'config/rviz/approach1_octomap_*.rviz'
      - '.github/workflows/approach2_complete_evidence.yml'
      - 'docker/Dockerfile'

permissions:
  contents: write

concurrency:
  group: approach2-complete-evidence-pr
  cancel-in-progress: false

jobs:
  approach2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [HcMR_lab, ISR_5th_floor]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Register three verified stationary scans
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install mcap mcap-ros2-support numpy scipy pyyaml
          ROOT="results/approach_2/${{ matrix.environment }}"
          mkdir -p "$ROOT/icp" "$ROOT/merged_cloud" "$ROOT/octomap" "$ROOT/scan_01" "$ROOT/scan_02" "$ROOT/scan_03"
          python3 tools/approach_2/register_three_static_scans.py \
            --environment-dir "study_data/approach_2_three_static_icp/${{ matrix.environment }}" \
            --out "$ROOT/icp"
          python3 tools/approach_2/registration_tf_commands.py \
            --metrics "$ROOT/icp/registration_metrics.json" \
            --out "$ROOT/icp/start_registration_tf.sh"
          chmod +x "$ROOT/icp/start_registration_tf.sh"
          cp "$ROOT/icp/merged_registered.xyz" "$ROOT/merged_cloud/merged_registered.xyz"
          chmod -R a+rwX "$ROOT"

      - name: Build reproducible ROS 2 evidence image
        run: docker build -t unitree-l1-evidence -f docker/Dockerfile .

      - name: Start headless RViz container
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --rm --name a2 --network host -v "$PWD:/workspace" unitree-l1-evidence sleep infinity
          docker exec -d a2 bash -lc 'Xvfb :99 -screen 0 1600x900x24 -ac >/tmp/xvfb.log 2>&1'
          sleep 3
          docker exec a2 bash -lc 'pgrep -a Xvfb; command -v ffmpeg; command -v xdotool; ros2 pkg prefix rosbag2_storage_mcap'

      - name: Capture each original scan — accumulation, isometric, top, side
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_2/${{ matrix.environment }}"
          for N in 01 02 03; do
            BAG="study_data/approach_2_three_static_icp/${{ matrix.environment }}/scan_${N}"
            DEST="$ROOT/scan_${N}"
            cp "$BAG/selection.yaml" "$DEST/selection.yaml"
            cp config/rviz/approach1_pointcloud_accumulation.rviz "$DEST/pointcloud_isometric.rviz"
            cp config/rviz/approach1_pointcloud_top_wide.rviz "$DEST/pointcloud_top.rviz"
            cp config/rviz/approach1_pointcloud_side_wide.rviz "$DEST/pointcloud_side.rviz"
            chmod -R a+rwX "$DEST"
            SEC=$(python3 -c "import yaml,math; d=yaml.safe_load(open('$BAG/selection.yaml')); print(max(4,math.ceil(float(d['duration_s']))+2))")

            docker exec a2 bash -lc 'pkill -x rviz2 || true; pkill -x ffmpeg || true'; sleep 2
            docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_accumulation.rviz >/tmp/raw_iso.log 2>&1'; sleep 6
            docker exec -d a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t '"$SEC"' -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$DEST"'/01_raw_accumulation_rviz.mp4 >/tmp/raw_video.log 2>&1'; sleep 1
            docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/'"$BAG"' --storage mcap --topics /unilidar/cloud'
            sleep 2; docker exec a2 bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
            docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$DEST"'/02_raw_final_isometric.png >/dev/null 2>&1'

            docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
            docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_top_wide.rviz >/tmp/raw_top.log 2>&1'; sleep 5
            docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/'"$BAG"' --storage mcap --rate 4.0 --topics /unilidar/cloud'; sleep 2
            docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$DEST"'/03_raw_final_top.png >/dev/null 2>&1'

            docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
            docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_side_wide.rviz >/tmp/raw_side.log 2>&1'; sleep 5
            docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/'"$BAG"' --storage mcap --rate 4.0 --topics /unilidar/cloud'; sleep 2
            docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$DEST"'/04_raw_final_side.png >/dev/null 2>&1'
          done

      - name: Capture ICP before and after in isolated RViz sessions
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_2/${{ matrix.environment }}/icp"
          cp config/rviz/approach2_registered_scans_wide.rviz "$OUT/registered_scans_fitted.rviz"
          chmod -R a+rwX "$OUT"
          for STATE in raw registered; do
            docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
            docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach2_registered_scans_wide.rviz >/tmp/icp_'"$STATE"'.log 2>&1'; sleep 6
            for N in 01 02 03; do
              docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$OUT"'/scan_'"$N"'_'"$STATE"'.xyz --topic /scan_'"$N"'_registered --frame-id unilidar_lidar --chunk-points 10000 --period 0.05'
            done
            sleep 2
            if [ "$STATE" = raw ]; then FILE=01_before_icp_isometric.png; else FILE=02_after_icp_isometric.png; fi
            docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/'"$FILE"' >/dev/null 2>&1'
          done

      - name: Capture merged registered cloud — isometric, top, side
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_2/${{ matrix.environment }}/merged_cloud"
          cp config/rviz/approach2_merged_cloud_wide.rviz "$OUT/merged_isometric.rviz"
          cp config/rviz/approach2_merged_cloud_top.rviz "$OUT/merged_top.rviz"
          cp config/rviz/approach2_merged_cloud_side.rviz "$OUT/merged_side.rviz"
          chmod -R a+rwX "$OUT"
          for ITEM in 'approach2_merged_cloud_wide.rviz 01_merged_isometric.png' 'approach2_merged_cloud_top.rviz 02_merged_top.png' 'approach2_merged_cloud_side.rviz 03_merged_side.png'; do
            set -- $ITEM; CFG=$1; FILE=$2
            docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
            docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/'"$CFG"' >/tmp/merged.log 2>&1'; sleep 5
            docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$OUT"'/merged_registered.xyz --topic /merged_cloud --frame-id unilidar_lidar --chunk-points 10000 --period 0.05'; sleep 2
            docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/'"$FILE"' >/dev/null 2>&1'
          done

      - name: Build OctoMap with three ICP-estimated sensor origins
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_2/${{ matrix.environment }}"; OUT="$ROOT/octomap"
          cp config/rviz/approach1_octomap_isometric.rviz "$OUT/octomap_isometric.rviz"
          cp config/rviz/approach1_octomap_top.rviz "$OUT/octomap_top.rviz"
          cp config/rviz/approach1_octomap_side.rviz "$OUT/octomap_side.rviz"
          cp "$ROOT/icp/registration_metrics.json" "$OUT/registration_metrics.json"
          chmod -R a+rwX "$OUT"
          docker exec a2 bash -lc 'pkill -x rviz2 || true; pkill -x octomap_server_node || true'; sleep 2
          docker exec -d a2 bash -lc 'bash /workspace/'"$ROOT"'/icp/start_registration_tf.sh'; sleep 3
          docker exec -d a2 bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_server_node --ros-args --params-file /workspace/ros2_ws/src/l1_octomap_bringup/config/octomap.yaml -r cloud_in:=/registered_cloud >/tmp/octomap.log 2>&1'; sleep 4
          docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/octomap_rviz.log 2>&1'; sleep 6
          docker exec -d a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 18 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/01_octomap_build_rviz.mp4 >/tmp/octomap_video.log 2>&1'; sleep 1
          docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$ROOT"'/icp/scan_01_raw.xyz --topic /registered_cloud --frame-id unilidar_lidar --chunk-points 8000 --period 0.05'
          docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$ROOT"'/icp/scan_02_raw.xyz --topic /registered_cloud --frame-id scan_02 --chunk-points 8000 --period 0.05'
          docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$ROOT"'/icp/scan_03_raw.xyz --topic /registered_cloud --frame-id scan_03 --chunk-points 8000 --period 0.05'
          sleep 4; docker exec a2 bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
          docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p octomap_path:=/workspace/'"$OUT"'/map.bt'
          docker exec a2 bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p full:=true -p octomap_path:=/workspace/'"$OUT"'/map.ot'
          docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/02_final_isometric.png >/dev/null 2>&1'

          docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_top.rviz >/tmp/top.log 2>&1'; sleep 5
          docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/03_final_top.png >/dev/null 2>&1'
          docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_side.rviz >/tmp/side.log 2>&1'; sleep 5
          docker exec a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/04_final_side.png >/dev/null 2>&1'

          docker exec a2 bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a2 bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/orbit.log 2>&1'; sleep 5
          docker exec -d a2 bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/05_3d_orbit_rviz.mp4 >/tmp/orbitvideo.log 2>&1'; sleep 1
          docker exec a2 bash -lc 'export DISPLAY=:99; WIN=$(xdotool search --onlyvisible --name RViz | head -1 || true); if [ -n "$WIN" ]; then xdotool windowactivate --sync "$WIN"; for j in $(seq 1 24); do xdotool mousemove --window "$WIN" 800 450 mousedown 1 mousemove_relative --sync 22 0 mouseup 1; sleep 0.35; done; fi'; sleep 3
          docker rm -f a2

      - name: Validate and document complete Approach 2
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_2/${{ matrix.environment }}"
          for N in 01 02 03; do
            for F in 01_raw_accumulation_rviz.mp4 02_raw_final_isometric.png 03_raw_final_top.png 04_raw_final_side.png; do test -s "$ROOT/scan_${N}/$F"; done
          done
          for F in 01_before_icp_isometric.png 02_after_icp_isometric.png registration_metrics.json; do test -s "$ROOT/icp/$F"; done
          for F in 01_merged_isometric.png 02_merged_top.png 03_merged_side.png merged_registered.xyz; do test -s "$ROOT/merged_cloud/$F"; done
          for F in 01_octomap_build_rviz.mp4 02_final_isometric.png 03_final_top.png 04_final_side.png 05_3d_orbit_rviz.mp4 map.bt map.ot registration_metrics.json; do test -s "$ROOT/octomap/$F"; done
          cat > "$ROOT/README.md" <<'EOF'
          # Approach 2 — three stationary scans + ICP — complete RViz evidence

          Each original stationary scan retains its source selection plus a real RViz accumulation video and fitted isometric/top/side screenshots. `icp/` retains raw and registered XYZ point sets, quantitative rigid transforms and isolated before/after RViz evidence. `merged_cloud/` contains only measured points after ICP, with three RViz perspectives. `octomap/` integrates the three registered raw scans using their three distinct ICP-estimated sensor origins, and contains a real build video, isometric/top/side screenshots, a real RViz 3D orbit, and native `.bt/.ot` maps.

          No undocumented robot/LiDAR rotation is used in this static method and no unobserved surfaces are reconstructed.
          EOF

      - name: Commit complete Approach 2 outputs
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git lfs install
          git add .gitattributes results/approach_2 mapping_data/02_approach_2_three_static_icp config/rviz tools/approach_2 .github/workflows/approach2_complete_evidence.yml
          git diff --cached --quiet || git commit -m "Regenerate complete Approach 2 evidence for ${{ matrix.environment }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - uses: actions/upload-artifact@v4
        with:
          name: approach2-complete-${{ matrix.environment }}
          path: results/approach_2/${{ matrix.environment }}/
          if-no-files-found: error

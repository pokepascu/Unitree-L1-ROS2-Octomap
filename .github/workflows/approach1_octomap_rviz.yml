name: Approach 1 OctoMap and RViz evidence

on:
  workflow_dispatch:
  push:
    branches: [analysis/approach-1-static]
    paths:
      - 'tools/approach_1/publish_xyz_cloud.py'
      - 'config/rviz/approach1_octomap_*.rviz'
      - 'docker/Dockerfile'
      - '.github/workflows/approach1_octomap_rviz.yml'

permissions:
  contents: write

concurrency:
  group: approach1-octomap-rviz
  cancel-in-progress: false

jobs:
  octomap-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      max-parallel: 1
      matrix:
        include:
          - env_name: HcMR_lab
            bag: study_data/approach_1_single_static/HcMR_lab/scan_01/static_segment.mcap
            config: config/approach_1/hcmr.yaml
            raw_video_seconds: 20
          - env_name: ISR_5th_floor
            bag: study_data/approach_1_single_static/ISR_5th_floor/scan_01/static_segment.mcap
            config: config/approach_1/isr_5th_floor.yaml
            raw_video_seconds: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install host analysis and capture tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool
          python3 -m pip install --upgrade pip
          python3 -m pip install mcap mcap-ros2-support numpy scipy matplotlib pyyaml open3d

      - name: Build ROS 2 Humble replay image
        shell: bash
        run: docker build -t unitree-l1-octomap -f docker/Dockerfile .

      - name: Prepare conservatively cleaned XYZ cloud
        shell: bash
        run: |
          set -euxo pipefail
          TMP="/tmp/analysis_${{ matrix.env_name }}"
          rm -rf "$TMP" && mkdir -p "$TMP"
          python3 tools/approach_1/analyze_static_cloud.py \
            --bag '${{ matrix.bag }}' \
            --config '${{ matrix.config }}' \
            --out "$TMP"
          python3 - <<'PY'
          import open3d as o3d, numpy as np, os
          env=os.environ['ENV_NAME']
          p=f'/tmp/analysis_{env}/conservative_cleaned.ply'
          q=f'/tmp/analysis_{env}/cleaned.xyz'
          pts=np.asarray(o3d.io.read_point_cloud(p).points)
          np.savetxt(q,pts,fmt='%.6f')
          print('CLEANED_XYZ_POINTS',len(pts))
          PY
        env:
          ENV_NAME: ${{ matrix.env_name }}

      - name: Start virtual X display and ROS container
        shell: bash
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1600x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2
          mkdir -p "results/approach_1/octomap/${{ matrix.env_name }}"
          chmod -R 777 results/approach_1/octomap
          docker run -d --rm \
            --name octomap_capture \
            --network host \
            -e DISPLAY=:99 -e QT_X11_NO_MITSHM=1 -e LIBGL_ALWAYS_SOFTWARE=1 \
            -v /tmp/.X11-unix:/tmp/.X11-unix \
            -v "$PWD:/workspace" \
            -v "/tmp/analysis_${{ matrix.env_name }}:/analysis:ro" \
            unitree-l1-octomap sleep infinity

      - name: Build raw PointCloud2 OctoMap and capture RViz
        shell: bash
        run: |
          set -euxo pipefail
          MODE_DIR="results/approach_1/octomap/${{ matrix.env_name }}/raw_pointcloud"
          mkdir -p "$MODE_DIR"
          cp config/rviz/approach1_octomap_isometric.rviz "$MODE_DIR/octomap_isometric.rviz"
          cp config/rviz/approach1_octomap_top.rviz "$MODE_DIR/octomap_top.rviz"
          cp config/rviz/approach1_octomap_side.rviz "$MODE_DIR/octomap_side.rviz"
          cat > "$MODE_DIR/parameters.yaml" <<'EOF'
          frame_id: unilidar_lidar
          resolution_m: 0.10
          sensor_model_max_range_m: 15.0
          filter_ground_plane: false
          source: original verified static PointCloud2 rosbag
          EOF

          docker exec -d octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 run octomap_server octomap_server_node --ros-args --params-file /workspace/ros2_ws/src/l1_octomap_bringup/config/octomap.yaml -r cloud_in:=/unilidar/cloud > /tmp/octomap_raw.log 2>&1'
          sleep 4
          docker exec -d octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz > /tmp/rviz_raw.log 2>&1'
          sleep 8

          ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 \
            -t ${{ matrix.raw_video_seconds }} -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            "$MODE_DIR/01_octomap_build_rviz.mp4" >/tmp/raw_video.log 2>&1 & VID=$!
          sleep 1
          docker exec octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 bag play /workspace/${{ matrix.bag }} --storage mcap --topics /unilidar/cloud'
          wait "$VID" || true
          sleep 4

          docker exec octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 run octomap_server octomap_saver_node --ros-args -p octomap_path:=/workspace/'"$MODE_DIR"'/map.bt'
          docker exec octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 run octomap_server octomap_saver_node --ros-args -p full:=true -p octomap_path:=/workspace/'"$MODE_DIR"'/map.ot'
          test -s "$MODE_DIR/map.bt" && test -s "$MODE_DIR/map.ot"

          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 "$MODE_DIR/02_final_isometric.png" >/dev/null 2>&1
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true'
          sleep 2
          docker exec -d octomap_capture bash -lc 'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_top.rviz >/tmp/rviz_top.log 2>&1'
          sleep 6
          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 "$MODE_DIR/03_final_top.png" >/dev/null 2>&1
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true'
          sleep 2
          docker exec -d octomap_capture bash -lc 'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_side.rviz >/tmp/rviz_side.log 2>&1'
          sleep 6
          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 "$MODE_DIR/04_final_side.png" >/dev/null 2>&1
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true'
          sleep 2
          docker exec -d octomap_capture bash -lc 'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/rviz_orbit.log 2>&1'
          sleep 6
          ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 12 \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p "$MODE_DIR/05_octomap_3d_orbit_rviz.mp4" >/tmp/orbit_raw.log 2>&1 & ORB=$!
          export DISPLAY=:99
          WIN=$(xdotool search --onlyvisible --name 'RViz' | head -1 || true)
          if [ -n "$WIN" ]; then
            xdotool windowactivate --sync "$WIN"
            for j in $(seq 1 24); do
              xdotool mousemove --window "$WIN" 800 450 mousedown 1 mousemove_relative --sync 22 0 mouseup 1
              sleep 0.35
            done
          fi
          wait "$ORB" || true
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true; pkill -f octomap_server_node || true'
          sleep 3

      - name: Build cleaned-cloud OctoMap and capture RViz
        shell: bash
        run: |
          set -euxo pipefail
          MODE_DIR="results/approach_1/octomap/${{ matrix.env_name }}/conservative_cleaned"
          mkdir -p "$MODE_DIR"
          cp config/rviz/approach1_octomap_isometric.rviz "$MODE_DIR/octomap_isometric.rviz"
          cp config/rviz/approach1_octomap_top.rviz "$MODE_DIR/octomap_top.rviz"
          cp config/rviz/approach1_octomap_side.rviz "$MODE_DIR/octomap_side.rviz"
          cat > "$MODE_DIR/parameters.yaml" <<'EOF'
          frame_id: unilidar_lidar
          resolution_m: 0.10
          sensor_model_max_range_m: 15.0
          filter_ground_plane: false
          source: conservative cleaned static cloud (range + 5 cm voxel + SOR + ROR)
          EOF

          docker exec -d octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 run octomap_server octomap_server_node --ros-args --params-file /workspace/ros2_ws/src/l1_octomap_bringup/config/octomap.yaml -r cloud_in:=/cleaned_cloud > /tmp/octomap_clean.log 2>&1'
          sleep 4
          docker exec -d octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz > /tmp/rviz_clean.log 2>&1'
          sleep 8

          ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 15 \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p "$MODE_DIR/01_octomap_build_rviz.mp4" >/tmp/clean_video.log 2>&1 & VID=$!
          sleep 1
          docker exec octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /analysis/cleaned.xyz --topic /cleaned_cloud --frame-id unilidar_lidar'
          wait "$VID" || true
          sleep 4

          docker exec octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 run octomap_server octomap_saver_node --ros-args -p octomap_path:=/workspace/'"$MODE_DIR"'/map.bt'
          docker exec octomap_capture bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 run octomap_server octomap_saver_node --ros-args -p full:=true -p octomap_path:=/workspace/'"$MODE_DIR"'/map.ot'
          test -s "$MODE_DIR/map.bt" && test -s "$MODE_DIR/map.ot"

          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 "$MODE_DIR/02_final_isometric.png" >/dev/null 2>&1
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true'
          sleep 2
          docker exec -d octomap_capture bash -lc 'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_top.rviz >/tmp/rviz_top2.log 2>&1'
          sleep 6
          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 "$MODE_DIR/03_final_top.png" >/dev/null 2>&1
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true'
          sleep 2
          docker exec -d octomap_capture bash -lc 'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_side.rviz >/tmp/rviz_side2.log 2>&1'
          sleep 6
          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 "$MODE_DIR/04_final_side.png" >/dev/null 2>&1
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true'
          sleep 2
          docker exec -d octomap_capture bash -lc 'source /opt/ros/humble/setup.bash && rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/rviz_orbit2.log 2>&1'
          sleep 6
          ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 12 \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p "$MODE_DIR/05_octomap_3d_orbit_rviz.mp4" >/tmp/orbit_clean.log 2>&1 & ORB=$!
          export DISPLAY=:99
          WIN=$(xdotool search --onlyvisible --name 'RViz' | head -1 || true)
          if [ -n "$WIN" ]; then
            xdotool windowactivate --sync "$WIN"
            for j in $(seq 1 24); do
              xdotool mousemove --window "$WIN" 800 450 mousedown 1 mousemove_relative --sync 22 0 mouseup 1
              sleep 0.35
            done
          fi
          wait "$ORB" || true
          docker exec octomap_capture bash -lc 'pkill -f rviz2 || true; pkill -f octomap_server_node || true'

      - name: Write environment README and reopening commands
        shell: bash
        run: |
          ROOT="results/approach_1/octomap/${{ matrix.env_name }}"
          cat > "$ROOT/README.md" <<'EOF'
          # Approach 1 OctoMap visual evidence

          Two maps are retained for the same verified stationary acquisition and identical OctoMap parameters:

          - `raw_pointcloud/`: direct integration of the original `/unilidar/cloud` PointCloud2 stream;
          - `conservative_cleaned/`: integration of the derived cloud after range filtering, 5 cm voxelization, Statistical Outlier Removal and Radius Outlier Removal.

          Each directory contains:

          - `01_octomap_build_rviz.mp4`: real RViz recording while the map is built;
          - `02_final_isometric.png`: final isometric RViz view;
          - `03_final_top.png`: final top RViz view;
          - `04_final_side.png`: final side RViz view;
          - `05_octomap_3d_orbit_rviz.mp4`: real RViz camera-orbit inspection;
          - `map.bt`: compact binary occupancy tree;
          - `map.ot`: full OctoMap tree;
          - three `.rviz` files defining the reference views;
          - `parameters.yaml`: parameters and data provenance.

          To reopen a saved map with ROS 2 Humble:

          ```bash
          ros2 run octomap_server octomap_server_node --ros-args \
            -p octomap_path:=/absolute/path/to/map.bt \
            -p frame_id:=unilidar_lidar

          rviz2 -d octomap_isometric.rviz
          ```

          The server supports `octomap_path` loading and republishes the map as RViz-compatible markers/topics. The raw map is the sensor-data reference; the cleaned map is a derived comparison and never replaces the raw evidence.
          EOF

      - name: Validate outputs and commit evidence
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_1/octomap/${{ matrix.env_name }}"
          for mode in raw_pointcloud conservative_cleaned; do
            for f in 01_octomap_build_rviz.mp4 02_final_isometric.png 03_final_top.png 04_final_side.png 05_octomap_3d_orbit_rviz.mp4 map.bt map.ot parameters.yaml octomap_isometric.rviz; do
              test -s "$ROOT/$mode/$f"
            done
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install
          git add .gitattributes docker/Dockerfile tools/approach_1/publish_xyz_cloud.py config/rviz results/approach_1/octomap .github/workflows/approach1_octomap_rviz.yml
          git diff --cached --quiet || git commit -m "Add Approach 1 OctoMap RViz evidence for ${{ matrix.env_name }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - name: Upload complete OctoMap artifact
        uses: actions/upload-artifact@v4
        with:
          name: approach1-octomap-${{ matrix.env_name }}
          path: results/approach_1/octomap/${{ matrix.env_name }}/
          if-no-files-found: error

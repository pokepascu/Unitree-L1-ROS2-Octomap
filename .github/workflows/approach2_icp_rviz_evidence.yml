name: Approach 2 three-scan ICP RViz evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/approach_2/**'
      - 'config/rviz/approach2_*.rviz'
      - '.github/workflows/approach2_icp_rviz_evidence.yml'
      - 'docker/Dockerfile'

permissions:
  contents: write

concurrency:
  group: approach2-icp-rviz-pr
  cancel-in-progress: true

jobs:
  approach2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      matrix:
        environment: [HcMR_lab, ISR_5th_floor]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install deterministic analysis dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install mcap mcap-ros2-support numpy scipy pyyaml

      - name: Register three stationary scans with geometry-driven ICP
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_2/${{ matrix.environment }}"
          mkdir -p "$OUT/icp" "$OUT/merged_cloud" "$OUT/octomap"
          python3 tools/approach_2/register_three_static_scans.py \
            --environment-dir "study_data/approach_2_three_static_icp/${{ matrix.environment }}" \
            --out "$OUT/icp"
          python3 tools/approach_2/registration_tf_commands.py \
            --metrics "$OUT/icp/registration_metrics.json" \
            --out "$OUT/icp/start_registration_tf.sh"
          chmod +x "$OUT/icp/start_registration_tf.sh"
          cp "$OUT/icp/merged_registered.xyz" "$OUT/merged_cloud/merged_registered.xyz"

      - name: Build reusable ROS 2 evidence image
        run: docker build -t unitree-l1-evidence -f docker/Dockerfile .

      - name: Start headless RViz container
        shell: bash
        run: |
          set -euxo pipefail
          chmod -R a+rwX results/approach_2
          docker run -d --rm --name a2_capture --network host -v "$PWD:/workspace" unitree-l1-evidence sleep infinity
          docker exec -d a2_capture bash -lc 'Xvfb :99 -screen 0 1600x900x24 -ac >/tmp/xvfb.log 2>&1'
          sleep 3
          docker exec a2_capture bash -lc 'pgrep -a Xvfb; command -v ffmpeg; ros2 pkg prefix rosbag2_storage_mcap'

      - name: Capture each raw stationary scan in wide RViz view
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_2/${{ matrix.environment }}"
          for N in 01 02 03; do
            BAG="study_data/approach_2_three_static_icp/${{ matrix.environment }}/scan_${N}"
            DEST="$ROOT/scan_${N}"
            mkdir -p "$DEST"
            cp "$BAG/selection.yaml" "$DEST/selection.yaml"
            cp config/rviz/approach1_pointcloud_accumulation.rviz "$DEST/raw_pointcloud_wide.rviz"
            SEC=$(python3 -c "import yaml,math; d=yaml.safe_load(open('$BAG/selection.yaml')); print(max(4,math.ceil(float(d['duration_s']))+2))")
            docker exec a2_capture bash -lc 'pkill -x rviz2 || true; pkill -x ffmpeg || true'
            sleep 2
            docker exec -d a2_capture bash -lc \
              'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_accumulation.rviz >/tmp/a2_scan_'"$N"'_rviz.log 2>&1'
            sleep 7
            docker exec -d a2_capture bash -lc \
              'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t '"$SEC"' -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$DEST"'/01_raw_accumulation_rviz.mp4 >/tmp/a2_scan_'"$N"'_ffmpeg.log 2>&1'
            sleep 1
            docker exec a2_capture bash -lc \
              'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/'"$BAG"' --storage mcap --topics /unilidar/cloud'
            sleep 2
            docker exec a2_capture bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
            docker exec a2_capture bash -lc \
              'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$DEST"'/02_raw_final_wide_isometric.png >/tmp/a2_scan_'"$N"'_shot.log 2>&1'
          done

      - name: Capture ICP before and after registration in RViz
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_2/${{ matrix.environment }}/icp"
          cp config/rviz/approach2_registered_scans_wide.rviz "$OUT/registered_scans_wide.rviz"
          docker exec a2_capture bash -lc 'pkill -x rviz2 || true'
          sleep 2
          docker exec -d a2_capture bash -lc \
            'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach2_registered_scans_wide.rviz >/tmp/a2_icp_rviz.log 2>&1'
          sleep 7
          # BEFORE: three local sensor clouds overlaid at the same origin.
          for N in 01 02 03; do
            docker exec -d a2_capture bash -lc \
              'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$OUT"'/scan_'"$N"'_raw.xyz --topic /scan_'"$N"'_registered --frame-id unilidar_lidar --chunk-points 10000 --period 0.05'
          done
          sleep 8
          docker exec a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/01_before_icp_wide.png >/tmp/a2_icp_before.log 2>&1'
          sleep 3
          # AFTER: ICP-transformed clouds in the scan-01 reference frame.
          for N in 01 02 03; do
            docker exec -d a2_capture bash -lc \
              'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$OUT"'/scan_'"$N"'_registered.xyz --topic /scan_'"$N"'_registered --frame-id unilidar_lidar --chunk-points 10000 --period 0.05'
          done
          sleep 8
          docker exec a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/02_after_icp_wide.png >/tmp/a2_icp_after.log 2>&1'

      - name: Capture merged ICP cloud in RViz
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_2/${{ matrix.environment }}/merged_cloud"
          cp config/rviz/approach2_merged_cloud_wide.rviz "$OUT/merged_cloud_wide.rviz"
          docker exec a2_capture bash -lc 'pkill -x rviz2 || true'
          sleep 2
          docker exec -d a2_capture bash -lc \
            'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach2_merged_cloud_wide.rviz >/tmp/a2_merged_rviz.log 2>&1'
          sleep 7
          docker exec a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$OUT"'/merged_registered.xyz --topic /merged_cloud --frame-id unilidar_lidar --chunk-points 10000 --period 0.05'
          sleep 3
          docker exec a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/01_merged_cloud_wide_isometric.png >/tmp/a2_merged_shot.log 2>&1'

      - name: Build OctoMap with three registered sensor origins
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_2/${{ matrix.environment }}"
          OUT="$ROOT/octomap"
          cp config/rviz/approach1_octomap_isometric.rviz "$OUT/octomap_isometric.rviz"
          cp config/rviz/approach1_octomap_top.rviz "$OUT/octomap_top.rviz"
          cp config/rviz/approach1_octomap_side.rviz "$OUT/octomap_side.rviz"
          cp "$ROOT/icp/registration_metrics.json" "$OUT/registration_metrics.json"
          docker exec a2_capture bash -lc 'pkill -x rviz2 || true; pkill -x octomap_server_node || true'
          sleep 2
          docker exec -d a2_capture bash -lc 'bash /workspace/'"$ROOT"'/icp/start_registration_tf.sh'
          sleep 3
          docker exec -d a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_server_node --ros-args --params-file /workspace/ros2_ws/src/l1_octomap_bringup/config/octomap.yaml -r cloud_in:=/registered_cloud >/tmp/a2_octomap.log 2>&1'
          sleep 4
          docker exec -d a2_capture bash -lc \
            'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/a2_octomap_rviz.log 2>&1'
          sleep 7
          docker exec -d a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 18 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/01_octomap_build_rviz.mp4 >/tmp/a2_octomap_video.log 2>&1'
          docker exec a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$ROOT"'/icp/scan_01_raw.xyz --topic /registered_cloud --frame-id unilidar_lidar --chunk-points 8000 --period 0.05'
          docker exec a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$ROOT"'/icp/scan_02_raw.xyz --topic /registered_cloud --frame-id scan_02 --chunk-points 8000 --period 0.05'
          docker exec a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /workspace/'"$ROOT"'/icp/scan_03_raw.xyz --topic /registered_cloud --frame-id scan_03 --chunk-points 8000 --period 0.05'
          sleep 4
          docker exec a2_capture bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
          docker exec a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p octomap_path:=/workspace/'"$OUT"'/map.bt'
          docker exec a2_capture bash -lc \
            'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p full:=true -p octomap_path:=/workspace/'"$OUT"'/map.ot'
          docker exec a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/02_final_isometric.png >/tmp/a2_octomap_iso.log 2>&1'
          docker exec a2_capture bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a2_capture bash -lc \
            'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_top.rviz >/tmp/a2_octomap_top.log 2>&1'
          sleep 6
          docker exec a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/03_final_top.png >/dev/null 2>&1'
          docker exec a2_capture bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a2_capture bash -lc \
            'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_side.rviz >/tmp/a2_octomap_side.log 2>&1'
          sleep 6
          docker exec a2_capture bash -lc \
            'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/04_final_side.png >/dev/null 2>&1'

      - name: Validate and document Approach 2
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_2/${{ matrix.environment }}"
          for N in 01 02 03; do test -s "$ROOT/scan_${N}/02_raw_final_wide_isometric.png"; done
          test -s "$ROOT/icp/01_before_icp_wide.png"
          test -s "$ROOT/icp/02_after_icp_wide.png"
          test -s "$ROOT/icp/registration_metrics.json"
          test -s "$ROOT/merged_cloud/01_merged_cloud_wide_isometric.png"
          for F in 01_octomap_build_rviz.mp4 02_final_isometric.png 03_final_top.png 04_final_side.png map.bt map.ot; do test -s "$ROOT/octomap/$F"; done
          cat > "$ROOT/README.md" <<'EOF'
          # Approach 2 — three stationary scans + ICP

          Each `scan_0N/` retains canonical wide RViz evidence of the original stationary PointCloud2. `icp/` contains the raw and registered XYZ clouds, before/after RViz evidence and quantitative registration transformations/metrics. `merged_cloud/` is the union of measured points after ICP. `octomap/` integrates the three registered raw scans while preserving their distinct ICP-estimated sensor origins; it includes `.bt`, `.ot`, wide RViz views and a build video.

          No undocumented LiDAR rotation is introduced. The ICP transforms are estimated from measured geometry. Recorded stop positions are used only as diagnostic displacement information.
          EOF

      - name: Commit Approach 2 outputs
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install
          git add .gitattributes results/approach_2 mapping_data/02_approach_2_three_static_icp config/rviz tools/approach_2 .github/workflows/approach2_icp_rviz_evidence.yml
          git diff --cached --quiet || git commit -m "Add complete Approach 2 evidence for ${{ matrix.environment }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - uses: actions/upload-artifact@v4
        with:
          name: approach2-${{ matrix.environment }}
          path: results/approach_2/${{ matrix.environment }}/
          if-no-files-found: error

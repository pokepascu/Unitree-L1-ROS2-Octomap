name: NAS download diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SHARE_URL: https://nas-greenbotics.isr.uc.pt/drive/d/s/19Nbg4F76IZ5qEWUbGyWhFfmqULZf0kO/lzGW7jJopGGo_ZGmhFpz4dQizFZiahPs-P7_gYpHyaA0

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Recursively inventory Synology public folder
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, re, requests
          from urllib.parse import quote

          share = "https://nas-greenbotics.isr.uc.pt/drive/d/s/19Nbg4F76IZ5qEWUbGyWhFfmqULZf0kO/lzGW7jJopGGo_ZGmhFpz4dQizFZiahPs-P7_gYpHyaA0"
          m = re.match(r"^(https?://[^/]+)/drive/d/s/([^/]+)/([^/?]+)", share)
          base, perm, sharing = m.groups()
          s = requests.Session(); r=s.get(share,timeout=30); r.raise_for_status()
          token=[c.value for c in s.cookies if c.name.startswith('drive-sharing-')][0]
          api=(f"{base}/drive/webapi/entry.cgi?api=SYNO.SynologyDrive.Shard&version=1&method=getjs"
               f"&permanent_link={quote(json.dumps(perm))}&sharing_link={quote(json.dumps(sharing))}")
          js=s.get(api,timeout=30).text
          marker='getDriveFile=function(){return '; p=js.find(marker)
          if p<0:
              marker='window.getDriveFile=function(){return '; p=js.find(marker)
          start=p+len(marker); depth=0; ins=False; esc=False; end=None
          for i,ch in enumerate(js[start:],start):
              if ins:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': ins=False
                  continue
              if ch=='"': ins=True
              elif ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          root=json.loads(js[start:end])
          endpoint=f"{base}/drive/webapi/entry.cgi"
          def listdir(fid):
              params={'api':'SYNO.SynologyDrive.Files','method':'list','version':'2','path':f'id:{fid}','offset':0,'limit':1000,'sharing_token':json.dumps(token)}
              rr=s.get(endpoint,params=params,timeout=60); rr.raise_for_status(); j=rr.json()
              assert j.get('success'), j
              return (j.get('data') or {}).get('items') or []
          rows=[]
          def walk(item,prefix=''):
              path=f"{prefix}/{item['name']}" if prefix else item['name']
              rows.append({'path':path,'file_id':item['file_id'],'type':item.get('type'),'content_type':item.get('content_type'),'size':item.get('size',0),'hash':item.get('hash','')})
              if item.get('type')=='dir' or item.get('content_type')=='dir':
                  for child in listdir(item['file_id']): walk(child,path)
          for child in listdir(root['file_id']): walk(child)
          print('INVENTORY_JSON=')
          print(json.dumps(rows,indent=2))
          mcaps=[x for x in rows if x['path'].lower().endswith('.mcap')]
          print('\nMCAP_SUMMARY')
          for x in mcaps: print(f"{x['path']}\t{x['size']} bytes\t{x['file_id']}")
          print(f"MCAP_COUNT={len(mcaps)}")
          print(f"MCAP_TOTAL_BYTES={sum(int(x['size']) for x in mcaps)}")
          assert len(mcaps)>=3, f'Expected at least 3 MCAP files, found {len(mcaps)}'
          PY

name: Approach 1 final OctoMap wide RViz evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/approach1_octomap_final_evidence.yml'
      - 'config/rviz/approach1_octomap_*.rviz'
      - 'tools/approach_1/**'
      - 'docker/Dockerfile'

permissions:
  contents: write

concurrency:
  group: approach1-octomap-final-pr
  cancel-in-progress: true

jobs:
  octomap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      matrix:
        include:
          - env_name: HcMR_lab
            bag_dir: study_data/approach_1_single_static/HcMR_lab/scan_01
            bag_file: study_data/approach_1_single_static/HcMR_lab/scan_01/static_segment.mcap
            config: config/approach_1/hcmr.yaml
            record_seconds: 20
          - env_name: ISR_5th_floor
            bag_dir: study_data/approach_1_single_static/ISR_5th_floor/scan_01
            bag_file: study_data/approach_1_single_static/ISR_5th_floor/scan_01/static_segment.mcap
            config: config/approach_1/isr_5th_floor.yaml
            record_seconds: 42

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare conservative cleaned cloud from the verified stationary bag
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install mcap mcap-ros2-support numpy scipy matplotlib pyyaml open3d
          TMP="/tmp/a1clean_${{ matrix.env_name }}"; rm -rf "$TMP"; mkdir -p "$TMP"
          python3 tools/approach_1/analyze_static_cloud.py --bag '${{ matrix.bag_file }}' --config '${{ matrix.config }}' --out "$TMP"
          python3 - <<'PY'
          import open3d as o3d, numpy as np
          from pathlib import Path
          env='${{ matrix.env_name }}'; p=Path('/tmp')/f'a1clean_{env}'
          pts=np.asarray(o3d.io.read_point_cloud(str(p/'conservative_cleaned.ply')).points)
          np.savetxt(p/'conservative_cleaned.xyz',pts,fmt='%.6f')
          print('CLEAN_POINTS',len(pts))
          PY

      - name: Build reproducible evidence image
        run: docker build -t unitree-l1-evidence -f docker/Dockerfile .

      - name: Prepare result directories
        shell: bash
        run: |
          ROOT="results/approach_1/octomap/${{ matrix.env_name }}"
          for MODE in raw_pointcloud conservative_cleaned; do
            mkdir -p "$ROOT/$MODE"
            cp config/rviz/approach1_octomap_isometric.rviz "$ROOT/$MODE/octomap_isometric.rviz"
            cp config/rviz/approach1_octomap_top.rviz "$ROOT/$MODE/octomap_top.rviz"
            cp config/rviz/approach1_octomap_side.rviz "$ROOT/$MODE/octomap_side.rviz"
          done
          printf '%s\n' 'frame_id: unilidar_lidar' 'resolution_m: 0.10' 'sensor_model_max_range_m: 15.0' 'source: verified raw stationary PointCloud2' > "$ROOT/raw_pointcloud/parameters.yaml"
          printf '%s\n' 'frame_id: unilidar_lidar' 'resolution_m: 0.10' 'sensor_model_max_range_m: 15.0' 'source: conservative cleaned measured cloud (range + voxel + SOR + ROR)' > "$ROOT/conservative_cleaned/parameters.yaml"
          chmod -R a+rwX results/approach_1/octomap

      - name: Build raw PointCloud2 OctoMap and capture all RViz evidence
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_1/octomap/${{ matrix.env_name }}/raw_pointcloud"
          docker run -d --rm --name a1_raw --network host -v "$PWD:/workspace" unitree-l1-evidence sleep infinity
          docker exec -d a1_raw bash -lc 'Xvfb :99 -screen 0 1600x900x24 -ac >/tmp/xvfb.log 2>&1'; sleep 3
          docker exec -d a1_raw bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_server_node --ros-args --params-file /workspace/ros2_ws/src/l1_octomap_bringup/config/octomap.yaml -r cloud_in:=/unilidar/cloud >/tmp/octomap.log 2>&1'; sleep 4
          docker exec -d a1_raw bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/rviz.log 2>&1'; sleep 7
          docker exec -d a1_raw bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t ${{ matrix.record_seconds }} -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/01_octomap_build_rviz.mp4 >/tmp/buildvideo.log 2>&1'; sleep 1
          docker exec a1_raw bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/${{ matrix.bag_dir }} --storage mcap --topics /unilidar/cloud'; sleep 4
          docker exec a1_raw bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
          docker exec a1_raw bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p octomap_path:=/workspace/'"$OUT"'/map.bt'
          docker exec a1_raw bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p full:=true -p octomap_path:=/workspace/'"$OUT"'/map.ot'
          docker exec a1_raw bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/02_final_wide_isometric.png >/dev/null 2>&1'
          docker exec a1_raw bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_raw bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_top.rviz >/tmp/top.log 2>&1'; sleep 6
          docker exec a1_raw bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/03_final_wide_top.png >/dev/null 2>&1'
          docker exec a1_raw bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_raw bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_side.rviz >/tmp/side.log 2>&1'; sleep 6
          docker exec a1_raw bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/04_final_wide_side.png >/dev/null 2>&1'
          docker exec a1_raw bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_raw bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/orbit.log 2>&1'; sleep 6
          docker exec -d a1_raw bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/05_3d_orbit_rviz.mp4 >/tmp/orbitvideo.log 2>&1'; sleep 1
          docker exec a1_raw bash -lc 'export DISPLAY=:99; WIN=$(xdotool search --onlyvisible --name RViz | head -1 || true); if [ -n "$WIN" ]; then xdotool windowactivate --sync "$WIN"; for j in $(seq 1 24); do xdotool mousemove --window "$WIN" 800 450 mousedown 1 mousemove_relative --sync 22 0 mouseup 1; sleep 0.35; done; fi'; sleep 3
          docker rm -f a1_raw

      - name: Build conservative cleaned OctoMap and capture all RViz evidence
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_1/octomap/${{ matrix.env_name }}/conservative_cleaned"
          docker run -d --rm --name a1_clean --network host -v "$PWD:/workspace" -v "/tmp/a1clean_${{ matrix.env_name }}:/analysis:ro" unitree-l1-evidence sleep infinity
          docker exec -d a1_clean bash -lc 'Xvfb :99 -screen 0 1600x900x24 -ac >/tmp/xvfb.log 2>&1'; sleep 3
          docker exec -d a1_clean bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_server_node --ros-args --params-file /workspace/ros2_ws/src/l1_octomap_bringup/config/octomap.yaml -r cloud_in:=/cleaned_cloud >/tmp/octomap.log 2>&1'; sleep 4
          docker exec -d a1_clean bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/rviz.log 2>&1'; sleep 7
          docker exec -d a1_clean bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 15 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/01_octomap_build_rviz.mp4 >/tmp/buildvideo.log 2>&1'; sleep 1
          docker exec a1_clean bash -lc 'source /opt/ros/humble/setup.bash; python3 /workspace/tools/approach_1/publish_xyz_cloud.py --xyz /analysis/conservative_cleaned.xyz --topic /cleaned_cloud --frame-id unilidar_lidar --chunk-points 6000 --period 0.08'; sleep 4
          docker exec a1_clean bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
          docker exec a1_clean bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p octomap_path:=/workspace/'"$OUT"'/map.bt'
          docker exec a1_clean bash -lc 'source /opt/ros/humble/setup.bash; ros2 run octomap_server octomap_saver_node --ros-args -p full:=true -p octomap_path:=/workspace/'"$OUT"'/map.ot'
          docker exec a1_clean bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/02_final_wide_isometric.png >/dev/null 2>&1'
          docker exec a1_clean bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_clean bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_top.rviz >/tmp/top.log 2>&1'; sleep 6
          docker exec a1_clean bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/03_final_wide_top.png >/dev/null 2>&1'
          docker exec a1_clean bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_clean bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_side.rviz >/tmp/side.log 2>&1'; sleep 6
          docker exec a1_clean bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 /workspace/'"$OUT"'/04_final_wide_side.png >/dev/null 2>&1'
          docker exec a1_clean bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_clean bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_octomap_isometric.rviz >/tmp/orbit.log 2>&1'; sleep 6
          docker exec -d a1_clean bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p /workspace/'"$OUT"'/05_3d_orbit_rviz.mp4 >/tmp/orbitvideo.log 2>&1'; sleep 1
          docker exec a1_clean bash -lc 'export DISPLAY=:99; WIN=$(xdotool search --onlyvisible --name RViz | head -1 || true); if [ -n "$WIN" ]; then xdotool windowactivate --sync "$WIN"; for j in $(seq 1 24); do xdotool mousemove --window "$WIN" 800 450 mousedown 1 mousemove_relative --sync 22 0 mouseup 1; sleep 0.35; done; fi'; sleep 3
          docker rm -f a1_clean

      - name: Validate and document final Approach 1 OctoMaps
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="results/approach_1/octomap/${{ matrix.env_name }}"
          for MODE in raw_pointcloud conservative_cleaned; do
            for F in 01_octomap_build_rviz.mp4 02_final_wide_isometric.png 03_final_wide_top.png 04_final_wide_side.png 05_3d_orbit_rviz.mp4 map.bt map.ot parameters.yaml octomap_isometric.rviz octomap_top.rviz octomap_side.rviz; do test -s "$ROOT/$MODE/$F"; done
          done
          cat > "$ROOT/README.md" <<'EOF'
          # Approach 1 — final wide RViz OctoMap evidence

          `raw_pointcloud/` is the canonical sensor reference and retains all measured points, including transient scene content. `conservative_cleaned/` is a derived comparison using range filtering, 5 cm voxelization, Statistical Outlier Removal and Radius Outlier Removal; no low-persistence foreground is silently removed. Both maps use 0.10 m OctoMap resolution, 15 m max range and the stationary `unilidar_lidar` frame.

          Each mode contains a real RViz build video, wide isometric/top/side screenshots, a real RViz orbit video, native `.bt` and `.ot` maps, parameters and the RViz configs used to reopen the result.
          EOF

      - name: Commit final Approach 1 OctoMap evidence
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git lfs install
          git add .gitattributes results/approach_1/octomap config/rviz tools/approach_1 .github/workflows/approach1_octomap_final_evidence.yml
          git diff --cached --quiet || git commit -m "Add final wide Approach 1 OctoMap evidence for ${{ matrix.env_name }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - uses: actions/upload-artifact@v4
        with:
          name: approach1-octomap-${{ matrix.env_name }}
          path: results/approach_1/octomap/${{ matrix.env_name }}/
          if-no-files-found: error

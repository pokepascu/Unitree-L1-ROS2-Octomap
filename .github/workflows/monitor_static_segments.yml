name: Monitor strict static segment diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-22.04
    steps:
      - name: Find and monitor latest strict static segment diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          sleep 8
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow static_segment_diagnostic.yml --branch automation/nas-ingest --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "Monitoring static diagnostic run $RUN_ID"
          if ! gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5; then
            echo '--- FAILED LOGS ---'
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
            exit 1
          fi
          echo '--- COMPLETE LOG ---'
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log

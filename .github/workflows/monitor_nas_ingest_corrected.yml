name: Monitor corrected NAS ingestion

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-22.04
    steps:
      - name: Find and monitor latest corrected ingestion run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          sleep 12
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nas_ingest_corrected.yml --branch automation/nas-ingest --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "Monitoring corrected ingestion run $RUN_ID"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY"
          if ! gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10; then
            echo '--- FAILED LOGS ---'
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
            exit 1
          fi
          echo '--- FINAL RUN ---'
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY"

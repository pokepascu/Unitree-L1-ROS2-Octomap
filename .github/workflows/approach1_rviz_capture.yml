name: Approach 1 PointCloud2 wide RViz evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config/rviz/approach1_pointcloud_*.rviz'
      - '.github/workflows/approach1_rviz_capture.yml'
      - 'docker/Dockerfile'

permissions:
  contents: write

concurrency:
  group: approach1-pointcloud-wide-pr
  cancel-in-progress: false

jobs:
  pointcloud:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - env_name: HcMR_lab
            bag_dir: study_data/approach_1_single_static/HcMR_lab/scan_01
            record_seconds: 20
          - env_name: ISR_5th_floor
            bag_dir: study_data/approach_1_single_static/ISR_5th_floor/scan_01
            record_seconds: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build evidence image
        run: docker build -t unitree-l1-evidence -f docker/Dockerfile .

      - name: Start capture container
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud"
          mkdir -p "$OUT"; chmod -R a+rwX results/approach_1/rviz_evidence
          cp config/rviz/approach1_pointcloud_accumulation.rviz "$OUT/pointcloud_isometric_wide.rviz"
          cp config/rviz/approach1_pointcloud_top_wide.rviz "$OUT/pointcloud_top_wide.rviz"
          cp config/rviz/approach1_pointcloud_side_wide.rviz "$OUT/pointcloud_side_wide.rviz"
          docker run -d --rm --name a1_pc --network host -v "$PWD:/workspace" unitree-l1-evidence sleep infinity
          docker exec -d a1_pc bash -lc 'Xvfb :99 -screen 0 1600x900x24 -ac >/tmp/xvfb.log 2>&1'; sleep 3

      - name: Record wide isometric accumulation
        shell: bash
        run: |
          set -euxo pipefail
          OUT="/workspace/results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud"
          docker exec -d a1_pc bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_accumulation.rviz >/tmp/a1_iso.log 2>&1'; sleep 7
          docker exec -d a1_pc bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 -t ${{ matrix.record_seconds }} -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p '"$OUT"'/01_accumulation_rviz.mp4 >/tmp/a1_iso_video.log 2>&1'; sleep 1
          docker exec a1_pc bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/${{ matrix.bag_dir }} --storage mcap --topics /unilidar/cloud'
          sleep 3; docker exec a1_pc bash -lc 'pkill -INT -x ffmpeg || true; sleep 2'
          docker exec a1_pc bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 '"$OUT"'/02_final_wide_isometric.png >/dev/null 2>&1'

      - name: Capture wide top and side views
        shell: bash
        run: |
          set -euxo pipefail
          OUT="/workspace/results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud"
          docker exec a1_pc bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_pc bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_top_wide.rviz >/tmp/a1_top.log 2>&1'; sleep 6
          docker exec a1_pc bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/${{ matrix.bag_dir }} --storage mcap --rate 4.0 --topics /unilidar/cloud'; sleep 2
          docker exec a1_pc bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 '"$OUT"'/03_final_wide_top.png >/dev/null 2>&1'
          docker exec a1_pc bash -lc 'pkill -x rviz2 || true'; sleep 2
          docker exec -d a1_pc bash -lc 'export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1; source /opt/ros/humble/setup.bash; rviz2 -d /workspace/config/rviz/approach1_pointcloud_side_wide.rviz >/tmp/a1_side.log 2>&1'; sleep 6
          docker exec a1_pc bash -lc 'source /opt/ros/humble/setup.bash; ros2 bag play /workspace/${{ matrix.bag_dir }} --storage mcap --rate 4.0 --topics /unilidar/cloud'; sleep 2
          docker exec a1_pc bash -lc 'export DISPLAY=:99; ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 '"$OUT"'/04_final_wide_side.png >/dev/null 2>&1'

      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud"
          for F in 01_accumulation_rviz.mp4 02_final_wide_isometric.png 03_final_wide_top.png 04_final_wide_side.png pointcloud_isometric_wide.rviz pointcloud_top_wide.rviz pointcloud_side_wide.rviz; do test -s "$OUT/$F"; done
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git lfs install
          git add .gitattributes results/approach_1/rviz_evidence config/rviz .github/workflows/approach1_rviz_capture.yml
          git diff --cached --quiet || git commit -m "Regenerate fitted Approach 1 PointCloud2 evidence for ${{ matrix.env_name }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - uses: actions/upload-artifact@v4
        with:
          name: approach1-pointcloud-${{ matrix.env_name }}
          path: results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud/
          if-no-files-found: error

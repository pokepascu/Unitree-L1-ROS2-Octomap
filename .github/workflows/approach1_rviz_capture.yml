name: Approach 1 RViz visual evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config/rviz/**'
      - 'docker/Dockerfile'
      - '.github/workflows/approach1_rviz_capture.yml'
      - 'results/approach_1/rviz_evidence/README.md'

permissions:
  contents: write

concurrency:
  group: approach1-rviz-evidence-pr
  cancel-in-progress: true

jobs:
  rviz-pointcloud-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      matrix:
        include:
          - env_name: HcMR_lab
            bag_dir: study_data/approach_1_single_static/HcMR_lab/scan_01
            record_seconds: 20
          - env_name: ISR_5th_floor
            bag_dir: study_data/approach_1_single_static/ISR_5th_floor/scan_01
            record_seconds: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify capture tools
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v Xvfb >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb ffmpeg
          fi
          Xvfb -help >/dev/null 2>&1 || true
          ffmpeg -version | head -1

      - name: Build existing ROS 2 Humble project image
        shell: bash
        run: |
          docker build -t unitree-l1-rviz -f docker/Dockerfile .

      - name: Start virtual display
        shell: bash
        run: |
          Xvfb :99 -screen 0 1600x900x24 -ac > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2

      - name: Start ROS/RViz container
        shell: bash
        run: |
          docker run -d --rm \
            --name rviz_capture \
            --network host \
            -e DISPLAY=:99 \
            -e QT_X11_NO_MITSHM=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -v /tmp/.X11-unix:/tmp/.X11-unix \
            -v "$PWD:/workspace" \
            unitree-l1-rviz sleep infinity

      - name: Launch RViz2 with canonical accumulation config
        shell: bash
        run: |
          docker exec -d rviz_capture bash -lc \
            'source /opt/ros/humble/setup.bash && source /opt/unitree_ws/install/setup.bash && rviz2 -d /workspace/config/rviz/approach1_pointcloud_accumulation.rviz > /tmp/rviz.log 2>&1'
          sleep 10
          docker exec rviz_capture bash -lc 'pgrep -a rviz2 && ros2 pkg prefix rosbag2_storage_mcap'

      - name: Record RViz while PointCloud2 accumulates
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud"
          mkdir -p "$OUT"
          cp config/rviz/approach1_pointcloud_accumulation.rviz "$OUT/pointcloud_accumulation.rviz"

          ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 \
            -t ${{ matrix.record_seconds }} -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            "$OUT/01_accumulation_rviz.mp4" > /tmp/ffmpeg-video.log 2>&1 &
          FFMPEG_PID=$!
          sleep 1

          docker exec rviz_capture bash -lc \
            'source /opt/ros/humble/setup.bash && source /opt/unitree_ws/install/setup.bash && ros2 bag play /workspace/${{ matrix.bag_dir }} --storage mcap --topics /unilidar/cloud /odom'

          wait "$FFMPEG_PID" || true
          sleep 3

          ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 \
            "$OUT/02_final_accumulated_isometric.png" > /tmp/ffmpeg-shot.log 2>&1
          test -s "$OUT/01_accumulation_rviz.mp4"
          test -s "$OUT/02_final_accumulated_isometric.png"

      - name: Commit RViz evidence
        shell: bash
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install
          git add .gitattributes config/rviz results/approach_1/rviz_evidence .github/workflows/approach1_rviz_capture.yml docker/Dockerfile
          git diff --cached --quiet || git commit -m "Add RViz PointCloud2 evidence for ${{ matrix.env_name }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - name: Upload RViz evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: rviz-${{ matrix.env_name }}-pointcloud-evidence
          path: results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud/
          if-no-files-found: error

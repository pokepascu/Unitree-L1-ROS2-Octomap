name: Approach 1 RViz visual evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config/rviz/**'
      - 'docker/Dockerfile'
      - '.github/workflows/approach1_rviz_capture.yml'
      - 'results/approach_1/rviz_evidence/README.md'

permissions:
  contents: write

concurrency:
  group: approach1-rviz-evidence-pr
  cancel-in-progress: true

jobs:
  rviz-pointcloud-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      matrix:
        include:
          - env_name: HcMR_lab
            bag_dir: study_data/approach_1_single_static/HcMR_lab/scan_01
            record_seconds: 20
          - env_name: ISR_5th_floor
            bag_dir: study_data/approach_1_single_static/ISR_5th_floor/scan_01
            record_seconds: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build self-contained ROS 2 RViz capture image
        run: docker build -t unitree-l1-rviz -f docker/Dockerfile .

      - name: Run RViz capture entirely inside container
        shell: bash
        run: |
          set -euxo pipefail
          OUT="results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud"
          mkdir -p "$OUT"
          cp config/rviz/approach1_pointcloud_accumulation.rviz "$OUT/pointcloud_accumulation.rviz"
          chmod -R 777 results/approach_1/rviz_evidence

          docker run --rm \
            --network host \
            -v "$PWD:/workspace" \
            unitree-l1-rviz bash -lc '
              set -euxo pipefail
              export DISPLAY=:99
              export LIBGL_ALWAYS_SOFTWARE=1
              Xvfb :99 -screen 0 1600x900x24 -ac >/tmp/xvfb.log 2>&1 &
              XVFB_PID=$!
              sleep 3
              source /opt/ros/humble/setup.bash
              source /opt/unitree_ws/install/setup.bash
              rviz2 -d /workspace/config/rviz/approach1_pointcloud_accumulation.rviz >/tmp/rviz.log 2>&1 &
              RVIZ_PID=$!
              sleep 10
              kill -0 "$RVIZ_PID"
              ros2 pkg prefix rosbag2_storage_mcap

              ffmpeg -y -f x11grab -video_size 1600x900 -framerate 20 -i :99 \
                -t ${{ matrix.record_seconds }} -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
                /workspace/'"$OUT"'/01_accumulation_rviz.mp4 >/tmp/ffmpeg-video.log 2>&1 &
              FFMPEG_PID=$!
              sleep 1

              ros2 bag play /workspace/${{ matrix.bag_dir }} --storage mcap --topics /unilidar/cloud /odom
              wait "$FFMPEG_PID" || true
              sleep 3

              ffmpeg -y -f x11grab -video_size 1600x900 -i :99 -frames:v 1 \
                /workspace/'"$OUT"'/02_final_accumulated_isometric.png >/tmp/ffmpeg-shot.log 2>&1

              test -s /workspace/'"$OUT"'/01_accumulation_rviz.mp4
              test -s /workspace/'"$OUT"'/02_final_accumulated_isometric.png
              kill "$RVIZ_PID" || true
              kill "$XVFB_PID" || true
            '

      - name: Commit RViz evidence
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install
          git add .gitattributes docker/Dockerfile config/rviz results/approach_1/rviz_evidence .github/workflows/approach1_rviz_capture.yml
          git diff --cached --quiet || git commit -m "Add RViz PointCloud2 evidence for ${{ matrix.env_name }}"
          git pull --rebase origin analysis/approach-1-static
          git push origin HEAD:analysis/approach-1-static

      - name: Upload RViz evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: rviz-${{ matrix.env_name }}-pointcloud-evidence
          path: results/approach_1/rviz_evidence/${{ matrix.env_name }}/pointcloud/
          if-no-files-found: error

name: Finalize corrected two-commit dataset history

on:
  push:
    branches: [automation/finalize-two-commits]

permissions:
  contents: write

env:
  BASE_SHA: e1c0395848f2ceb7fb8af028772218bc489517d0
  EXPECTED_MAIN_SHA: 5f349f27a147af34515afc144a48de7bcc4b2dbd
  SHARE_URL: https://nas-greenbotics.isr.uc.pt/drive/d/s/19Nbg4F76IZ5qEWUbGyWhFfmqULZf0kO/lzGW7jJopGGo_ZGmhFpz4dQizFZiahPs-P7_gYpHyaA0

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Guard current main and prepare base
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git switch -C corrected-two-commits "$BASE_SHA"

      - name: Install processing dependencies
        run: |
          python3 -m pip install mcap mcap-ros2-support pyyaml requests zstandard lz4

      - name: Download exact NAS source dataset
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/nas_download
          python3 - <<'PY'
          import json,re,requests
          from pathlib import Path
          from urllib.parse import quote
          SHARE='https://nas-greenbotics.isr.uc.pt/drive/d/s/19Nbg4F76IZ5qEWUbGyWhFfmqULZf0kO/lzGW7jJopGGo_ZGmhFpz4dQizFZiahPs-P7_gYpHyaA0'
          OUT=Path('/tmp/nas_download')
          base,perm,sharing=re.match(r'^(https?://[^/]+)/drive/d/s/([^/]+)/([^/?]+)',SHARE).groups()
          s=requests.Session(); r=s.get(SHARE,timeout=60); r.raise_for_status()
          token=[c.value for c in s.cookies if c.name.startswith('drive-sharing-')][0]
          api=(f'{base}/drive/webapi/entry.cgi?api=SYNO.SynologyDrive.Shard&version=1&method=getjs' f'&permanent_link={quote(json.dumps(perm))}&sharing_link={quote(json.dumps(sharing))}')
          js=s.get(api,timeout=60).text
          marker='getDriveFile=function(){return '; p=js.find(marker)
          if p<0: marker='window.getDriveFile=function(){return '; p=js.find(marker)
          if p<0: raise RuntimeError('Cannot parse Synology share metadata')
          start=p+len(marker); depth=0; ins=False; esc=False; end=None
          for i,ch in enumerate(js[start:],start):
              if ins:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': ins=False
                  continue
              if ch=='"': ins=True
              elif ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          root=json.loads(js[start:end]); endpoint=f'{base}/drive/webapi/entry.cgi'
          def listdir(fid):
              params={'api':'SYNO.SynologyDrive.Files','method':'list','version':'2','path':f'id:{fid}','offset':0,'limit':1000,'sharing_token':json.dumps(token)}
              rr=s.get(endpoint,params=params,timeout=60); rr.raise_for_status(); obj=rr.json()
              if not obj.get('success'): raise RuntimeError(obj)
              return (obj.get('data') or {}).get('items') or []
          files=[]
          def walk(item,prefix=Path()):
              rel=prefix/item['name']
              if item.get('type')=='dir' or item.get('content_type')=='dir':
                  for c in listdir(item['file_id']): walk(c,rel)
              else: files.append((rel,item))
          for c in listdir(root['file_id']): walk(c)
          wanted=[x for x in files if x[0].parts and x[0].parts[0].startswith('rosbag2_2026_08_07-21_')]
          mcaps=[x for x in wanted if x[0].suffix.lower()=='.mcap']
          if len(mcaps)!=3: raise RuntimeError(f'Expected 3 MCAPs, found {len(mcaps)}')
          for rel,item in wanted:
              dst=OUT/rel; dst.parent.mkdir(parents=True,exist_ok=True)
              url=f"{base}/drive/d/s/{perm}/webapi/entry.cgi/{quote(item['name'])}"
              params={'api':'SYNO.SynologyDrive.Files','method':'download','version':'2','download_type':json.dumps('download'),'files':json.dumps([f"id:{item['file_id']}"]),'force_download':'true','json_error':'true','sharing_token':json.dumps(token)}
              n=0
              with s.get(url,params=params,stream=True,timeout=(60,300)) as rr:
                  rr.raise_for_status()
                  with dst.open('wb') as f:
                      for chunk in rr.iter_content(1024*1024):
                          if chunk: f.write(chunk); n+=len(chunk)
              expected=int(item.get('size',0))
              if expected and n!=expected: raise RuntimeError(f'Size mismatch {rel}: {n} != {expected}')
              print('DOWNLOADED',rel,n)
          PY

      - name: Build corrected commit 1 with real raw bags
        shell: bash
        run: |
          set -euxo pipefail
          # Remove the old blanket ignore of bags so the raw scientific data can be tracked via LFS.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.gitignore'); text=p.read_text()
          text=text.replace('# Recorded sensor data (keep only the directory placeholder).\n/bags/*\n!/bags/.gitkeep\n\n','# Recorded sensor data are tracked explicitly with Git LFS.\n\n')
          p.write_text(text)
          PY
          git lfs track 'bags/**/*.mcap'
          git lfs track 'study_data/**/*.mcap'
          rm -f bags/.gitkeep bags/README.txt bags/rosbag2_2026_08_07-21_13_45_0.mcap bags/rosbag2_2026_08_07-21_31_58_0.mcap bags/rosbag2_2026_08_07-21_48_31_0.mcap || true
          mkdir -p bags/raw/HcMR_lab_2026-08-07_21-13-45 \
                   bags/raw/ISR_5th_floor_run_1_2026-08-07_21-31-58 \
                   bags/raw/ISR_5th_floor_run_2_2026-08-07_21-48-31
          cp /tmp/nas_download/rosbag2_2026_08_07-21_13_45/rosbag2_2026_08_07-21_13_45_0.mcap bags/raw/HcMR_lab_2026-08-07_21-13-45/
          cp /tmp/nas_download/rosbag2_2026_08_07-21_13_45/metadata.yaml bags/raw/HcMR_lab_2026-08-07_21-13-45/
          cp /tmp/nas_download/rosbag2_2026_08_07-21_31_58/rosbag2_2026_08_07-21_31_58_0.mcap bags/raw/ISR_5th_floor_run_1_2026-08-07_21-31-58/
          cp /tmp/nas_download/rosbag2_2026_08_07-21_31_58/metadata.yaml bags/raw/ISR_5th_floor_run_1_2026-08-07_21-31-58/
          cp /tmp/nas_download/rosbag2_2026_08_07-21_48_31/rosbag2_2026_08_07-21_48_31_0.mcap bags/raw/ISR_5th_floor_run_2_2026-08-07_21-48-31/
          cp /tmp/nas_download/rosbag2_2026_08_07-21_48_31/metadata.yaml bags/raw/ISR_5th_floor_run_2_2026-08-07_21-48-31/
          cat > bags/README.md <<'EOF'
          # Unitree L1 source rosbags

          Raw ROS 2 Humble recordings acquired on 7 August 2026 with the Unitree L1 3D LiDAR and the mobile platform.

          | Dataset | Environment | Purpose |
          |---|---|---|
          | `raw/HcMR_lab_2026-08-07_21-13-45/` | HcMR laboratory | Laboratory continuous run |
          | `raw/ISR_5th_floor_run_1_2026-08-07_21-31-58/` | ISR building, **5th floor** | Continuous mobile run 1 |
          | `raw/ISR_5th_floor_run_2_2026-08-07_21-48-31/` | ISR building, **5th floor** | Continuous mobile run 2 |

          The former “Floor 4” label was incorrect; the confirmed location is the **5th floor of the ISR building**.

          Relevant recorded streams are `/unilidar/cloud`, `/unilidar/imu`, `/odom`, `/tf`, and `/cmd_vel`. The source MCAPs are retained unchanged and tracked through Git LFS.

          Confirmed LiDAR translation relative to the mobile base:

          ```text
          base_link -> unilidar_lidar
          x = 0.0 m
          y = 0.0 m
          z = 1.0 m
          ```

          The rotational extrinsic has not been independently specified and is therefore not invented here.
          EOF
          git add .gitignore .gitattributes bags/README.md bags/unitree_l1.rviz
          git add -f bags/raw
          git commit -m 'Add raw Unitree L1 rosbags for HcMR lab and ISR 5th floor'

      - name: Build static subsets and corrected commit 2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tools study_data
          cat > tools/extract_static_rosbags.py <<'PY'
          #!/usr/bin/env python3
          import copy, csv, json
          from collections import Counter
          from pathlib import Path
          import yaml
          from mcap.reader import make_reader
          from mcap.writer import Writer

          SOURCES={
            'HcMR_lab':Path('bags/raw/HcMR_lab_2026-08-07_21-13-45'),
            'ISR_5th_floor_run_1':Path('bags/raw/ISR_5th_floor_run_1_2026-08-07_21-31-58'),
            'ISR_5th_floor_run_2':Path('bags/raw/ISR_5th_floor_run_2_2026-08-07_21-48-31'),
          }
          # Strict stationary segments verified with |v| <= 0.02 m/s and |omega| <= 0.02 rad/s.
          SELECTIONS=[
            # Approach 1: one representative static acquisition per environment.
            dict(approach='approach_1_single_static',environment='HcMR_lab',scan='scan_01',source='HcMR_lab',start=1786133723637021696,end=1786133738705244672,pose=(9.251,-0.595,0.0),note='Longest strict stationary interval available in the HcMR continuous bag; shorter than the ~30 s target.'),
            dict(approach='approach_1_single_static',environment='ISR_5th_floor',scan='scan_01',source='ISR_5th_floor_run_1',start=1786134757712538368,end=1786134793011322368,pose=(1.862,-1.070,0.0),note='Strict stationary interval longer than the ~30 s target.'),
            # Approach 2 HcMR: nearby, overlapping viewpoints chosen for ICP; all are genuinely stationary but shorter than 30 s.
            dict(approach='approach_2_three_static_icp',environment='HcMR_lab',scan='scan_01',source='HcMR_lab',start=1786133698660790784,end=1786133712355343616,pose=(7.072,-1.158,0.0),note='Strict stationary interval.'),
            dict(approach='approach_2_three_static_icp',environment='HcMR_lab',scan='scan_02',source='HcMR_lab',start=1786133723637021696,end=1786133738705244672,pose=(9.251,-0.595,0.0),note='Strict stationary interval.'),
            dict(approach='approach_2_three_static_icp',environment='HcMR_lab',scan='scan_03',source='HcMR_lab',start=1786133755547356928,end=1786133762945741568,pose=(11.806,-0.188,0.0),note='Strict stationary interval; short but spatially close enough to favour cloud overlap for ICP.'),
            # Approach 2 ISR: three successive nearby stationary viewpoints; scan 2/3 are short stops, explicitly documented.
            dict(approach='approach_2_three_static_icp',environment='ISR_5th_floor',scan='scan_01',source='ISR_5th_floor_run_1',start=1786134757712538368,end=1786134793011322368,pose=(1.862,-1.070,0.0),note='Strict stationary interval >30 s.'),
            dict(approach='approach_2_three_static_icp',environment='ISR_5th_floor',scan='scan_02',source='ISR_5th_floor_run_1',start=1786134801736246528,end=1786134805059976704,pose=(2.307,-3.125,0.0),note='Strict stationary interval; only ~3.3 s, retained because it is a nearby overlapping viewpoint.'),
            dict(approach='approach_2_three_static_icp',environment='ISR_5th_floor',scan='scan_03',source='ISR_5th_floor_run_1',start=1786134817986674688,end=1786134821518245120,pose=(1.949,-5.399,0.0),note='Strict stationary interval; only ~3.5 s, retained because it is a nearby overlapping viewpoint.'),
          ]

          def source_paths(name):
            d=SOURCES[name]
            return next(d.glob('*.mcap')), d/'metadata.yaml'

          def write_subset(sel):
            src,meta_path=source_paths(sel['source'])
            dest=Path('study_data')/sel['approach']/sel['environment']/sel['scan']
            dest.mkdir(parents=True,exist_ok=True)
            out=dest/'static_segment.mcap'
            schema_map={}; channel_map={}; counts=Counter(); first=None; last=None; total=0
            with src.open('rb') as f, out.open('wb') as g:
              reader=make_reader(f); writer=Writer(g); writer.start(profile='ros2',library='mcap-python derived static subset')
              for schema,channel,msg in reader.iter_messages(start_time=sel['start'],end_time=sel['end']):
                if schema is not None and schema.id not in schema_map:
                  schema_map[schema.id]=writer.register_schema(schema.name,schema.encoding,schema.data)
                if channel.id not in channel_map:
                  channel_map[channel.id]=writer.register_channel(channel.topic,channel.message_encoding,schema_map.get(channel.schema_id,0),dict(channel.metadata))
                writer.add_message(channel_map[channel.id],msg.log_time,msg.data,msg.publish_time,msg.sequence)
                counts[channel.topic]+=1; total+=1
                first=msg.log_time if first is None else min(first,msg.log_time)
                last=msg.log_time if last is None else max(last,msg.log_time)
              writer.finish()
            if total==0: raise RuntimeError(f'Empty selection: {sel}')
            original=yaml.safe_load(meta_path.read_text()); info=copy.deepcopy(original['rosbag2_bagfile_information'])
            topics=[]
            for item in info.get('topics_with_message_count',[]):
              name=item['topic_metadata']['name']
              if counts.get(name,0)>0:
                ni=copy.deepcopy(item); ni['message_count']=int(counts[name]); topics.append(ni)
            duration=int(last-first) if first is not None and last is not None else 0
            info['topics_with_message_count']=topics; info['message_count']=int(total)
            info['starting_time']={'nanoseconds_since_epoch':int(first)}; info['duration']={'nanoseconds':duration}
            info['relative_file_paths']=['static_segment.mcap']; info['files']=[{'path':'static_segment.mcap','starting_time':{'nanoseconds_since_epoch':int(first)},'duration':{'nanoseconds':duration},'message_count':int(total)}]
            (dest/'metadata.yaml').write_text(yaml.safe_dump({'rosbag2_bagfile_information':info},sort_keys=False))
            selection=dict(sel); selection['duration_s']=(sel['end']-sel['start'])/1e9; selection['message_count']=total; selection['topic_counts']=dict(sorted(counts.items()))
            (dest/'selection.yaml').write_text(yaml.safe_dump(selection,sort_keys=False))
            return selection

          rows=[write_subset(s) for s in SELECTIONS]
          with open('study_data/static_selection_report.csv','w',newline='') as f:
            w=csv.writer(f); w.writerow(['approach','environment','scan','source','start_ns','end_ns','duration_s','pose_x_m','pose_y_m','pose_z_m','message_count','note'])
            for r in rows: w.writerow([r['approach'],r['environment'],r['scan'],r['source'],r['start'],r['end'],r['duration_s'],*r['pose'],r['message_count'],r['note']])
          PY
          python3 tools/extract_static_rosbags.py
          cat > study_data/README.md <<'EOF'
          # Static subsets for mapping Approaches 1 and 2

          These MCAPs are derived **only from intervals verified as stationary by `/odom`**, using thresholds of 0.02 m/s linear speed and 0.02 rad/s angular speed. No interval is artificially extended with robot motion merely to reach 30 seconds.

          ## Approach 1 — single static scan

          - HcMR laboratory: the longest strict stationary period found in the continuous HcMR bag is about **15.1 s**.
          - ISR 5th floor: a strict stationary period of about **35.3 s** is available.

          The HcMR subset therefore does **not** meet the original ~30 s duration target. This limitation must be stated in the experimental report, or a dedicated static recording should be used/re-recorded if identical acquisition duration is required.

          ## Approach 2 — three static scans + ICP

          Three spatially distinct stationary views are provided for each environment. Selection prioritizes genuine stationarity and local geometric overlap for Iterative Closest Point (ICP), rather than selecting long but widely separated stops.

          HcMR durations are approximately **13.7 s, 15.1 s and 7.4 s**. ISR 5th-floor durations are approximately **35.3 s, 3.3 s and 3.5 s**. The two short ISR stops are scientifically usable as stationary point-cloud acquisitions, but they do not reproduce the planned 30 s-per-station protocol. A new acquisition is recommended if protocol fidelity is required for the final quantitative comparison.

          Each scan directory contains:

          - `static_segment.mcap` — derived standalone MCAP;
          - `metadata.yaml` — rosbag2 metadata rebuilt for the subset;
          - `selection.yaml` — exact source, timestamps, duration, approximate odometric pose, topic counts and selection note.

          `static_selection_report.csv` summarizes all selected intervals. The full immutable source recordings remain under `bags/raw/`.
          EOF
          git add tools/extract_static_rosbags.py study_data/README.md study_data/static_selection_report.csv
          git add -f study_data
          git commit -m 'Add verified static rosbags for single-scan and three-scan ICP studies'

      - name: Validate exactly two commits and publish corrected history
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 2
          git log --oneline "$BASE_SHA"..HEAD
          # Ensure source bags are genuinely tracked as LFS pointers in Git, not merely present in the workspace.
          git show HEAD~1:bags/raw/HcMR_lab_2026-08-07_21-13-45/rosbag2_2026_08_07-21_13_45_0.mcap | head -n 1 | grep -F 'version https://git-lfs.github.com/spec/v1'
          git show HEAD~1:bags/raw/ISR_5th_floor_run_1_2026-08-07_21-31-58/rosbag2_2026_08_07-21_31_58_0.mcap | head -n 1 | grep -F 'version https://git-lfs.github.com/spec/v1'
          git show HEAD~1:bags/raw/ISR_5th_floor_run_2_2026-08-07_21-48-31/rosbag2_2026_08_07-21_48_31_0.mcap | head -n 1 | grep -F 'version https://git-lfs.github.com/spec/v1'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git push --force-with-lease=refs/heads/main:$EXPECTED_MAIN_SHA origin HEAD:main

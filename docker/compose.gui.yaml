services:
  dev:
    environment:
      DISPLAY: "${DISPLAY:?DISPLAY must identify the graphical session}"
      XAUTHORITY: /tmp/host.xauthority
      QT_X11_NO_MITSHM: "1"
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
      - type: bind
        source: "${XAUTHORITY:?XAUTHORITY must point to the graphical session X11 cookie}"
        target: /tmp/host.xauthority
        read_only: true
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
